name: Release Drafter

on:
  push:
    branches:
      - main
  # pull_request_target supports autolabeler for PRs from forks; "edited"
  # re-runs it when a PR is retitled, since labels come from the title here.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  update_release_draft:
    if: github.event_name == 'push'
    permissions:
      # write permission is required to create/update the draft release
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Without a baseline, v7 finds no changes until a release is
      # published (see release_baseline.sh).
      - name: Find comparison baseline
        id: baseline
        run: echo "from=$(.github/scripts/release_baseline.sh)" >> "$GITHUB_OUTPUT"
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          from: ${{ steps.baseline.outputs.from }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Since v7 the drafter no longer applies the autolabeler rules itself.
  auto_label:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
