name: skill-lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 .github/scripts/check_skills.py

  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/test_install.sh
      - run: .github/scripts/test_dsg_update_check.sh
      - run: .github/scripts/test_dsg_tasks_context.sh
      - run: .github/scripts/test_release_baseline.sh
