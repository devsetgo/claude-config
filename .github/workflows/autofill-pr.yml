name: AI PR Assistant

# Requires an OPENAI_API_KEY repo secret. Without one the step fails and
# continue-on-error turns that into a silent no-op, so this workflow does
# nothing until the secret is added in repo settings.
#
# Tuned to coexist with Release Drafter (.github/release-drafter.yml),
# whose autolabeler reads Conventional-Commits PR titles (dsg-commit
# drafts them):
# - Titles: "smart" only on "opened" (replaces a placeholder title like
#   "Dev", keeps a good one), "never" on later pushes, so a title that's
#   already feeding the autolabeler isn't rewritten.
# - Labels: chosen from Release Drafter's category labels, and only
#   applied to a PR with no labels yet ("never"), so the AI fills gaps
#   instead of overriding the autolabeler.
# - Breaking changes get the action's "breaking-change" label, which
#   release-drafter.yml maps to its Breaking Changes category.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# contents:read to check out the repo; issues/pull-requests write for the
# description/title/label updates and creating missing labels.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-pr-assistant:
    runs-on: ubuntu-latest
    # Dependabot PRs get no custom secrets on pull_request, so the API key
    # would be empty; skip them explicitly rather than failing.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      # Options this repo doesn't change (provider, model, token budgets,
      # exclude_patterns, prompts, Azure) are left at the action's defaults;
      # see devsetgo/ai-pr-assistant's action.yml for the full list.
      - name: Autofill PR title, description, and labels
        continue-on-error: true
        uses: devsetgo/ai-pr-assistant@26.10.31-001
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          allowed_users: devsetgo
          overwrite_description: smart
          generate_title: true
          overwrite_title: ${{ github.event.action == 'opened' && 'smart' || 'never' }}
          enable_labels: true
          overwrite_labels: never
          label_taxonomy: 'feature,enhancement,bug,docs,code improvements,github actions,chore,dependencies'
          detect_breaking_changes: true
