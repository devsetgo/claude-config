# Configuration for release-drafter/release-drafter
# This file must live in the default branch at: .github/release-drafter.yml
#
# Release Drafter keeps a running, categorized draft of merged PRs. To
# release, merge a "Prepare release" PR that bumps VERSION with BumpCalver
# (YYYY.MM.DD.N), then publish this draft from the Releases tab with that
# exact version as its tag. The SemVer-oriented version/tag templates here
# aren't used.

name-template: "Release Notes (Draft)"

## `branch:` patterns work well when each PR comes from its own
## `feat/...`/`fix/...` branch. Since this repo mostly merges a single
## long-lived `dev` branch into `main`, `title:` patterns are included too
## so a Conventional-Commits-style PR title (`feat: ...`, `fix: ...`) is
## enough to get labeled even when the branch name doesn't match.
autolabeler:
  - label: 'breaking'
    branch:
      - '/^breaking[/-].+/'
    title:
      - '/^\w+(\(.+\))?!:/'
      - '/breaking change/i'
  - label: 'feature'
    branch:
      - '/^feat(ure)?[/-].+/'
    title:
      - '/^feat(ure)?(\(.+\))?:/'
  - label: 'enhancement'
    branch:
      - '/^enhance[/-].+/'
      - '/^improvement[/-].+/'
    title:
      - '/^(enhance|improve)(ment)?(\(.+\))?:/'
  - label: 'bug'
    branch:
      - '/^(fix|bugfix|hotfix)[/-].+/'
    title:
      - '/^(fix|bugfix|hotfix)(\(.+\))?:/'
  - label: 'docs'
    branch:
      - '/^docs?[/-].+/'
    title:
      - '/^docs?(\(.+\))?:/'
  - label: 'code improvements'
    branch:
      - '/^(refactor|optimize|perf|performance)[/-].+/'
    title:
      - '/^(refactor|optimize|perf|performance)(\(.+\))?:/'
  - label: 'github actions'
    branch:
      - '/^(ci|actions?|workflow)[/-].+/'
    title:
      - '/^ci(\(.+\))?:/'
  - label: 'chore'
    branch:
      - '/^(chore|test|cleanup)[/-].+/'
    title:
      - '/^(chore|test|cleanup)(\(.+\))?:/'
  - label: 'dependencies'
    branch:
      - '/^(dep|deps|bump|dependabot)[/-].+/'
    title:
      - '/^(deps?|bump)(\(.+\))?:/'

# exclusive: a PR lands only in the first category it matches, in this
# order, so a PR carrying several labels (e.g. bug + docs + github actions
# from the autolabeler and ai-pr-assistant) is listed once, under its most
# significant kind of change.
categories:
  - title: "Breaking Changes"
    exclusive: true
    when:
      labels:
        - "breaking"
        # Applied by devsetgo/ai-pr-assistant (autofill-pr.yml).
        - "breaking-change"
        - "Breaking Change"
  - title: "Features"
    exclusive: true
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "Bug Fixes"
    exclusive: true
    when:
      labels:
        - "bug"
        - "fix"
  - title: "Documentation"
    exclusive: true
    when:
      labels:
        - "docs"
  - title: "Code Improvements"
    exclusive: true
    when:
      labels:
        - "code improvements"
  - title: "GitHub Actions"
    exclusive: true
    when:
      labels:
        - "github actions"
  - title: "Maintenance"
    exclusive: true
    when:
      labels:
        - "chore"
        - "dependencies"

change-template: "- $TITLE (#$NUMBER) (@$AUTHOR)"
change-title-escapes: "<*_&"

template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS
