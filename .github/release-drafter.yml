# Configuration for release-drafter/release-drafter
# This file must live in the default branch at: .github/release-drafter.yml
#
# This repo doesn't tag versioned releases (VS Code's dotfiles feature just
# pulls whatever's on the default branch) — Release Drafter is used here
# purely to keep a running, categorized changelog of merged PRs visible in
# the GitHub Releases tab. The draft's version/tag fields can be ignored;
# never publish it as an actual numbered release unless that changes.

name-template: "Release Notes (Draft)"

## `branch:` patterns work well when each PR comes from its own
## `feat/...`/`fix/...` branch. Since this repo mostly merges a single
## long-lived `dev` branch into `main`, `title:` patterns are included too
## so a Conventional-Commits-style PR title (`feat: ...`, `fix: ...`) is
## enough to get labeled even when the branch name doesn't match.
autolabeler:
  - label: 'breaking'
    branch:
      - '/^breaking[/-].+/'
    title:
      - '/^\w+(\(.+\))?!:/'
      - '/breaking change/i'
  - label: 'feature'
    branch:
      - '/^feat(ure)?[/-].+/'
    title:
      - '/^feat(ure)?(\(.+\))?:/'
  - label: 'enhancement'
    branch:
      - '/^enhance[/-].+/'
      - '/^improvement[/-].+/'
    title:
      - '/^(enhance|improve)(ment)?(\(.+\))?:/'
  - label: 'bug'
    branch:
      - '/^(fix|bugfix|hotfix)[/-].+/'
    title:
      - '/^(fix|bugfix|hotfix)(\(.+\))?:/'
  - label: 'docs'
    branch:
      - '/^docs?[/-].+/'
    title:
      - '/^docs?(\(.+\))?:/'
  - label: 'code improvements'
    branch:
      - '/^(refactor|optimize|perf|performance)[/-].+/'
    title:
      - '/^(refactor|optimize|perf|performance)(\(.+\))?:/'
  - label: 'github actions'
    branch:
      - '/^(ci|actions?|workflow)[/-].+/'
    title:
      - '/^ci(\(.+\))?:/'
  - label: 'chore'
    branch:
      - '/^(chore|test|cleanup)[/-].+/'
    title:
      - '/^(chore|test|cleanup)(\(.+\))?:/'
  - label: 'dependencies'
    branch:
      - '/^(dep|deps|bump|dependabot)[/-].+/'
    title:
      - '/^(deps?|bump)(\(.+\))?:/'

categories:
  - title: "Breaking Changes"
    when:
      labels:
        - "breaking"
  - title: "Features"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "Bug Fixes"
    when:
      labels:
        - "bug"
        - "fix"
  - title: "Documentation"
    when:
      labels:
        - "docs"
  - title: "Code Improvements"
    when:
      labels:
        - "code improvements"
  - title: "GitHub Actions"
    when:
      labels:
        - "github actions"
  - title: "Maintenance"
    when:
      labels:
        - "chore"
        - "dependencies"

change-template: "- $TITLE (#$NUMBER) (@$AUTHOR)"
change-title-escapes: "<*_&"

template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS
