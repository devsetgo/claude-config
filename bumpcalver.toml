# BumpCalver (https://github.com/devsetgo/bumpcalver) config for this
# repo's releases: YYYY.MM.DD.N, where N counts releases that UTC day
# (resets to 1 each day). Run `bumpcalver --build` in a "Prepare release"
# PR. It only rewrites VERSION; the tag is created when the Release
# Drafter draft is published with that version as its tag.
version_format = "{current_date}.{build_count}"
date_format = "%Y.%m.%d"
timezone = "UTC"
git_tag = false
auto_commit = false

[[file]]
path = "VERSION"
file_type = "text"
